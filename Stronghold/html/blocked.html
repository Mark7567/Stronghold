<!-- HTML for the blocked page -->

<!DOCTYPE html>
<html>
    <head>
        <title>
            Stronghold Browser
        </title>

        <link rel = "stylesheet" href = "../css/theme.css">
        <link rel = "stylesheet" href = "../css/blocked.css">
    </head>

    <body>
        <main id = 'blocked_page'>
            <section id = 'blocked_box'>
                <div id = 'status'>
                    !
                </div>

                <h1 id = 'title'>
                    Blocked
                </h1>

                <div id = 'underline'>

                </div>

                <div class = 'info_box'>
                    <p class = 'label'>
                        Blocked URL / Download
                    </p>
                    <p id = 'blocked_url'>

                    </p>
                </div>

                <div class = 'info_box'>
                    <p class = 'label'>
                        Risk Score
                    </p>
                    <p id = 'blocked_score'>

                    </p>
                </div>

                <div class = 'info_box'>
                    <p class = 'label'>
                        Reasons
                    </p>
                    <p id = 'blocked_reasons'>

                    </p>
                </div>

                <button type = 'button' id = 'leave_button'>
                    Return to Safe Browsing
                </button>
            </section>
        </main>
    
        <script src = "../renderer.js"></script>
        <script type = 'module' src = '../firebase/blocked.js'></script>
    </body>
</html>
