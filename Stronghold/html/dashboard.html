<!-- HTML for the dashboard -->

<!DOCTYPE html>
<html>
    <head>
        <title>Stronghold Browser</title>
        <link rel = "stylesheet" href="../css/dashboard.css">
        <link rel = "stylesheet" href="../css/theme.css">
    </head>
    
    <body>
        <div class = 'dashboard_page'>
            <div class = 'dashboard_page_content'>
                <div class = 'dashboard_grid'>
                    <div class = 'column'>
                        <div id = 'user_info' class = 'info_grid'>
                            <h2 id = 'username'>
                                Username
                            </h2>

                            <p>
                                Safe Day Streak:
                                <span id = 'show_safe_day_streak' class = 'number'>
                                    0
                                </span>
                            </p>

                            <p>
                                Level:
                                <span id = 'show_level' class = 'number'>
                                    0
                                </span>
                            </p>
                        </div>
                    </div>

                    <div class = 'column'>
                        <div id = 'xp_info' class = 'info_grid'>
                            <h3>
                                XP Progress
                            </h3>

                            <div id = 'xp_level'>
                                <div id = 'xp_bar'>

                                </div>
                            </div>

                            <p id = 'xp_text'>
                                0 / 100 XP
                            </p>
                        </div>
                        
                        <div id = 'quizzes'>
                            <button id = 'daily_quiz'>
                                Daily Quiz
                            </button>

                            <button id = 'weekly_quiz'>
                                Weekly Quiz
                            </button>
                        </div>
                    </div>

                    <div class = 'column'>
                        <div id = 'stats' class = 'stat_grid'>
                            <div class = 'stats_card'>
                                <h3>
                                    Sites Blocked:
                                </h3>

                                <span id = 'show_sites_blocked'>
                                    0
                                </span>
                            </div>

                            <div class = 'stats_card'>
                                <h3>
                                    Downloads Blocked:
                                </h3>

                                <span id = 'show_downloads_blocked'>
                                    0
                                </span>
                            </div>

                            <div class = 'stats_card'>
                                <h3>
                                    Warnings Ignored:
                                </h3>

                                <span id = 'show_warnings_ignored'>
                                    0
                                </span>
                            </div>
                        </div>

                        <div id = 'recent_changes'>
                            <h3>
                                Recent XP Changes
                            </h3>

                            <ul id = 'recent_xp_changes'>

                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div id = 'dashboard_shroud' hidden>
            <button id = 'sign_in_from_dashboard_button'>Sign In</button>
        </div>

        <script type = 'module' src = "../theme.js"></script>
        <script type = 'module' src = "../firebase/dashboard.js"></script>
    </body>
</html>
