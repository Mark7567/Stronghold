<!-- HTML for the settings page -->

<!DOCTYPE html>
<html>
    <head>
        <title>
            Stronghold Browser
        </title>

        <link rel = 'stylesheet' href='../css/theme.css'>
        <link rel = "stylesheet" href="../css/settings.css">
    </head>

    <body>
        <main id = 'settings_page'>
            <section id = 'settings_box'>
                <h1 id = 'title'>
                    Settings
                </h1>

                <div id = 'underline'>

                </div>

                <div class = 'settings_content'>
                    <h2>
                        Protection Level
                    </h2>

                    <label class = 'options_card'>
                        <input type = 'radio' name = 'protectionLevel' value = 'strict'>
                        <div>
                            <strong>
                                Strict
                            </strong>
                            
                            <p>
                                Warn: 50+ // Block: 75+
                            </p>
                        </div>
                    </label>

                    <label class = 'options_card'>
                        <input type = 'radio' name = 'protectionLevel' value = 'normal'>
                        <div>
                            <strong>
                                Normal
                            </strong>
                            
                            <p>
                                Warn: 75+ // Block: 100+
                            </p>
                        </div>
                    </label>

                    <label class = 'options_card'>
                        <input type = 'radio' name = 'protectionLevel' value = 'warnOnly'>
                        <div>
                            <strong>
                                Warn Only
                            </strong>
                            
                            <p>
                                Warn: 50+ // Block: Never
                            </p>
                        </div>
                    </label>
                </div>

                <div class = 'settings_content'>
                    <h2>
                        Download Protection Level
                    </h2>

                    <label class = 'options_card'>
                        <input type = 'radio' name = 'downloadLevel' value = 'strict'>
                        <div>
                            <strong>
                                Strict
                            </strong>
                            
                            <p>
                                Blocks all risky extensions
                            </p>
                        </div>
                    </label>

                    <label class = 'options_card'>
                        <input type = 'radio' name = 'downloadLevel' value = 'normal'>
                        <div>
                            <strong>
                                Normal
                            </strong>
                            
                            <p>
                                Blocks most risky extensions, Warns against others
                            </p>
                        </div>
                    </label>

                    <label class = 'options_card'>
                        <input type = 'radio' name = 'downloadLevel' value = 'warnOnly'>
                        <div>
                            <strong>
                                Warn Only
                            </strong>
                            
                            <p>
                                Warns against all risky extensions, Never blocks
                            </p>
                        </div>
                    </label>
                </div>

                <div id = 'settings_content'>
                    <h2>
                        Theme
                    </h2>

                    <label class = 'options_card'>
                        <input type = 'radio' name = 'theme' value = 'dark'>
                        <div>
                            <strong>
                                Dark Mode
                            </strong>
                        </div>
                    </label>

                    <label class = 'options_card'>
                        <input type = 'radio' name = 'theme' value = 'light'>
                        <div>
                            <strong>
                                Light Mode
                            </strong>
                        </div>
                    </label>
                </div>

                <div id = 'settings_content'>
                    <h2>
                        Start Page
                    </h2>

                    <label class = 'options_card'>
                        <input type = 'radio' name = 'start' value = 'home_page'>
                        <div>
                            <strong>
                                Home Page
                            </strong>
                        </div>
                    </label>

                    <label class = 'options_card'>
                        <input type = 'radio' name = 'start' value = 'dashboard'>
                        <div>
                            <strong>
                                Dashboard
                            </strong>
                        </div>
                    </label>
                </div>

                <div id = 'delete_account'>
                    <button type = 'button' id = 'delete_account_button'>
                        Delete Account
                    </button>

                    <div id = 'delete_account_popup' class = 'hidden'>
                        <div id = 'popup'>
                            <div id = 'popup_content'>
                                <p>
                                    Are you sure?
                                </p>

                                <button id = 'yes_delete'>
                                    Yes
                                </button>

                                <button id = 'no_delete'>
                                    No
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <div id = 'settings_shroud' hidden>
            <button id = 'sign_in_from_settings_button'>Sign In</button>
        </div>
        
        <script type = 'module' src = '../theme.js'></script>
        <script type = 'module' src = "../firebase/settings.js"></script>
    </body>
</html>
