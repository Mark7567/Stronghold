<!-- HTML for the warning page -->

<!DOCTYPE html>
<html>
    <head>
        <title>
            Stronghold Browser
        </title>

        <link rel = "stylesheet" href = "../css/theme.css">
        <link rel = "stylesheet" href = "../css/warned.css">
    </head>

    <body>
        <main id = 'warned_page'>
            <section id = 'warned_box'>
                <div id = 'status'>
                    !
                </div>

                <h1 id = 'title'>
                    Warning
                </h1>

                <div id = 'underline'>

                </div>

                <p id = 'warned_message'>
                    This site may be unsafe
                </p>

                <div class = 'info_box'>
                    <p class = 'label'>
                        Dangerous URL / File
                    </p>

                    <p id = 'warned_url'>

                    </p>
                </div>

                <div class = 'info_box'>
                    <p class = 'label'>
                        Risk Score
                    </p>

                    <p id = 'warned_score'>
                        
                    </p>
                </div>

                <div class = 'info_box'>
                    <p class = 'label'>
                        Reasons
                    </p>

                    <p id = 'warned_reasons'>
                        
                    </p>
                </div>

                <div id = 'actions'>
                    <button id = 'leave_button' class = 'safe_button'>
                        Go Back
                    </button>

                    <button id = 'continue_button' class = 'danger_button'>
                        Continue Anyway
                    </button>
                </div>
            </section>
        </main>

        <script src = "../renderer.js"></script>
        <script type = 'module' src = '../firebase/warned.js'></script>
    </body>
</html>
